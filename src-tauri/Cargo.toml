[package]
name = "nexus-vault-core"
version = "0.1.0"
edition = "2021"
default-run = "nexus-vault-core"
authors = ["Nexus Vault Engineering <engineering@nexusvault.local>"]
description = "Core security, cryptographic engine, and domain services for Nexus Vault"

[lib]
name = "nexus_vault_core"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = { version = "0.10.1", features = ["alloc"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tauri = { version = "2", optional = true , features = [] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
url = "2"
tauri-plugin-updater = { version = "2", optional = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled by the Tauri CLI via tauri.conf.json `build.features`; plain `cargo test` builds the core only.
app = ["dep:tauri", "dep:tauri-plugin-updater"]

[[bin]]
name = "nexus-vault-core"
path = "src/main.rs"
required-features = ["app"]

[profile.release]
# One codegen unit: smaller binary, and avoids rustc stalling on the huge `windows` crate
# while waiting for parallel-codegen jobserver tokens on this toolchain.
codegen-units = 1
